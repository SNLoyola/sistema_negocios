<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <!-- Tipografias -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Quantico:ital,wght@0,400;0,700;1,400;1,700&family=Turret+Road:wght@400;700;800&display=swap" rel="stylesheet">
    <title>Orelith - Catálogos Digitales</title>
</head>
<body>
    <header>
        <h1 class="Orelith-title">Orelith</h1>
        <div class="modo-change"></div>
    </header>
    <main>
        <!-- Inicio: Cuerpo completo de el bloque "página del usuario" -->
        <section class="restaurant-card">
            <!-- Inicio de el bloque principal de "página del usuario" -->
            <h2>Opciones Menu Digital</h2>
            <div class="restaurant-card__features">
                <a href="https://drive.google.com/file/d/1o0clSEtig4f1f0ywRKcCZniohLWALGdh/view?usp=sharing" class="feature">
                <!-- Bloque del icono -->
                <div class="feature__icon">
                    <!-- Icono de cubiertos -->
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M7 2v7M4 2v5a3 3 0 0 0 6 0V2M7 10v12M17 2v20M17 2c-4 4-4 9 0 10" />
                    </svg>
                </div>
                <!-- Bloque de texto -->
                <div class="feature__content">
                    <h3>Opción 1</h3>
                    <p>Un link PDF con categorias, productos, precios y fotos de tu menú personalizado. [click]</p>
                </div>
                </a>

                <a href="menudigital.html" class="feature">
                <!-- Bloque del icono -->
                <div class="feature__icon">
                    <!-- Icono de catalogo -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="2.5" width="18" height="19" rx="2"/>
                    <path d="M3 7h18"/>
                    <circle cx="6" cy="4.8" r=".5" fill="currentColor" stroke="none"/>
                    <circle cx="8" cy="4.8" r=".5" fill="currentColor" stroke="none"/>
                    <rect x="5.5" y="9.5" width="5.5" height="5" rx=".8"/>
                    <path d="m6.5 13 1.4-1.5 1.8 2"/>
                    <path d="M13.5 10h4M13.5 12.5h4M5.5 17h13M5.5 19h9"/>
                    </svg>
                </div>
                <!-- Bloque de texto -->
                <div class="feature__content">
                    <h3>Opción 2</h3>
                    <p>Un menú digital con categorías, productos, precios, fotos e interacciones. (no incluye sist. compras)</p>
                </div>
                </a>
            </div>
        </section>
    </main>
    <footer>
        <p class="copyright">&copy; 2026 Orelith. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
