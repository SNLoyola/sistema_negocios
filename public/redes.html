<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <!-- Tipografias -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Quantico:ital,wght@0,400;0,700;1,400;1,700&family=Turret+Road:wght@400;700;800&display=swap" rel="stylesheet">
    <title>Orileth - Redes</title>
</head>
<body>
    <header>
        <h1 class="Orelith-title">Orelith</h1>
        <div class="modo-change"></div>
    </header>
    <main>
        <section class="social-section">
            <div class="social-section__content">
                <h2 class="social-section__title">Encontranos en redes</h2>

                <p class="social-section__description">
                    Seguinos para conocer nuestras novedades, promociones y productos.
                </p>

                <div class="social-section__buttons">
                    <!-- Inicio Instagram -->
                    <a
                        href="https://www.instagram.com/loyola_1005/?hl=es-la"
                        class="social-button"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Visitar nuestro Instagram"
                    >
                        <svg
                            class="social-button__icon"
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <rect x="3" y="3" width="18" height="18" rx="5"/>
                            <circle cx="12" cy="12" r="4"/>
                            <circle cx="18" cy="6" r="0.8" fill="currentColor"/>
                        </svg>

                        <span>Instagram</span>
                    </a>
                        <!-- FIn Instagram -->
                        <!-- Inicio Facebook -->
                    <a
                        href="https://www.facebook.com/santiago.nicolas.loyola.chiozzi"
                        class="social-button"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Visitar nuestro Facebook"
                    >
                        <svg
                            class="social-button__icon"
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24"
                            fill="currentColor"
                            aria-hidden="true"
                        >
                            <path d="M13.5 21v-8h2.7l.4-3.1h-3.1v-2c0-.9.3-1.5 1.6-1.5h1.7V3.6c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.1H7.3V13h2.8v8h3.4z"/>
                        </svg>

                        <span>Facebook</span>
                    </a>
                        <!-- Fin Facebook -->
                        <!-- Inicio TikTok -->
                    <a
                        href="https://www.tiktok.com/@tu_usuario"
                        class="social-button"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Visitar nuestro TikTok"
                    >
                        <svg
                            class="social-button__icon"
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24"
                            fill="currentColor"
                            aria-hidden="true"
                        >
                            <path d="M19.6 7.1a5.5 5.5 0 0 1-3.4-1.2v7.3a6.2 6.2 0 1 1-5.4-6.1v3.4a2.9 2.9 0 1 0 2 2.7V2h3.4c.2 2 1.5 3.6 3.4 4.1v1z"/>
                        </svg>
                        <span>TikTok</span>
                    </a>
                    <!-- Fin TikTok -->
                    <!-- Inicio GitHub -->
                    <a
                        href="https://github.com/SNLoyola"
                        class="social-button"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Visitar nuestro Instagram"
                    >
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M15 21V19C15.1392 17.7473 14.78 16.4901 14 15.5C17 15.5 20 13.5 20 10C20.08 8.75 19.73 7.52 19 6.5C19.28 5.35 19.28 4.15 19 3C19 3 18 3 16 4.5C13.36 4 10.64 4 8.00004 4.5C6.00004 3 5.00004 3 5.00004 3C4.70004 4.15 4.70004 5.35 5.00004 6.5C4.27191 7.51588 3.91851 8.75279 4.00004 10C4.00004 13.5 7.00004 15.5 10 15.5C9.61004 15.99 9.32004 16.55 9.15004 17.15C8.98004 17.75 8.93004 18.38 9.00004 19M9.00004 19V21M9.00004 19C4.49004 21 4 17 2 17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>

                        <span>GitHub</span>
                    </a>
                        <!-- FIn GitHub -->
                </div>
            </div>
        </section>
    </main>
    <footer>
        <p class="copyright">&copy; 2026 Orelith. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
