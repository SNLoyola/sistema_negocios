<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <!-- Tipografias -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Quantico:ital,wght@0,400;0,700;1,400;1,700&family=Turret+Road:wght@400;700;800&display=swap" rel="stylesheet">
    <title>Orelith</title>
</head>
<body>
    <header>
        <h1 class="Orelith-title">Orelith</h1>
        <div class="modo-change"></div>
    </header>
    <main>
        <!-- Inicio: Cuerpo completo de el bloque "página del usuario" -->
        <section class="restaurant-card">
            <!-- Titulo de el bloque "página del usuario" -->
            <div class="restaurant-title-block">
                <h2 class="restaurant-card__title">
                    Soluciones digitales y tecnologia
                </h2>
            </div>
            <!-- Inicio de el bloque principal de "página del usuario" -->
            <div class="restaurant-card__features">
                <a href="public/menu.html" class="feature">
                <!-- Bloque del icono -->
                <div class="feature__icon">
                    <!-- Icono de cubiertos -->
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M7 2v7M4 2v5a3 3 0 0 0 6 0V2M7 10v12M17 2v20M17 2c-4 4-4 9 0 10" />
                    </svg>
                </div>
                <!-- Bloque de texto -->
                <div class="feature__content">
                    <h3>Menú digital</h3>
                    <p>Categorías, productos, precios y fotos.</p>
                </div>
                </a>

                <a href="public/redes.html" class="feature">
                <!-- Bloque del icono -->
                <div class="feature__icon">
                    <!-- Icono de instagram -->
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="3" width="18" height="18" rx="5" />
                    <circle cx="12" cy="12" r="4" />
                    <circle cx="18" cy="6" r="1" />
                    </svg>
                </div>
                <!-- Bloque de texto -->
                <div class="feature__content">
                    <h3>Redes sociales</h3>
                    <p>Instagram, Facebook, TikTok u otras.</p>
                </div>
                </a>

                <a href="https://search.google.com/local/writereview?placeid=ChIJpUZBqrzDG5QROcGQG6jVWFg" class="feature">
                <!-- Bloque del icono -->
                <div class="feature__icon">
                    <!-- Icono de estrella -->
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z" />
                    </svg>
                </div>
                <!-- Bloque de texto -->
                <div class="feature__content">
                    <h3>Reseñas en Google</h3>
                    <p>Acceso directo para dejar una reseña honesta.</p>
                </div>
                </a>

                <a href="#contacto" class="feature">
                <!-- Bloque del icono -->
                <div class="feature__icon">
                    <!-- Icono de ubicación -->
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z" />
                    <circle cx="12" cy="10" r="2.5" />
                    </svg>
                </div>
                <!-- Bloque de texto -->
                <div class="feature__content">
                    <h3>Ubicación y contacto</h3>
                    <p>Dirección, horarios y WhatsApp, si corresponde.</p>
                </div>
                </a>
                <!-- Fin de el cuerpo principal de el bloque "Página del usuario" -->
            </div> 
        </section>

    </main>
</body>
</html>
